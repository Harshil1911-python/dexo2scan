name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp -r src/* www/
          ls -la www/

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform + sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch AndroidManifest for Camera & Gallery
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Add camera / media permissions if missing
            if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
              sed -i 's|<manifest |<manifest |' "$MANIFEST"
              # Insert permissions right after <manifest ...>
              python3 << 'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = """
      <uses-permission android:name=\"android.permission.CAMERA\" />
      <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
      <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
      <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
          """
          if "android.permission.CAMERA" not in content:
              content = re.sub(
                  r"(<manifest[^>]*>)",
                  r"\1\n" + perms,
                  content,
                  count=1,
              )
              with open(path, "w") as f:
                  f.write(content)
              print("Permissions injected into AndroidManifest.xml")
          else:
              print("CAMERA permission already present")
          PY
            fi
            echo "--- AndroidManifest (head) ---"
            head -40 "$MANIFEST"
          else
            echo "WARNING: AndroidManifest.xml not found"
            ls -la android/app/src/main/ || true
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dexo2scan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
